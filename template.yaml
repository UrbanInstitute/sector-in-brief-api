AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  sector-in-brief-api — modernized NCCS data-download API (ADR 0008 / 0026).
  DuckDB-on-parquet /data export behind a Lambda Function URL (no API Gateway 29s
  cap), writing to a dedicated results bucket with a 30-day lifecycle. Replaces
  the legacy Athena API. Slice 1: synchronous /data; durable /download, email
  receipt, and telemetry land in later slices.

Parameters:
  Stage:
    Type: String
    Default: stg
    AllowedValues: [stg, prod]

Conditions:
  IsProd: !Equals [!Ref Stage, prod]

Globals:
  Function:
    Runtime: python3.12
    LoggingConfig:
      LogFormat: JSON

Resources:
  ResultsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub sector-in-brief-api-results-${Stage}
      LifecycleConfiguration:
        Rules:
          # ADR 0008: 30-day lifecycle. Scoped to results/ so the requests/
          # registry (ADR 0026 §2) persists on a longer clock — the two-clocks rule.
          - Id: expire-results-30d
            Status: Enabled
            Prefix: results/
            ExpirationInDays: 30

  QueryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub sector-in-brief-api-query-${Stage}
      CodeUri: ./query/
      Handler: query.lambda_handler
      Architectures: [x86_64]
      MemorySize: 10240               # Lambda max — fits the heaviest realistic join (Phase-0: ~6 GB peak)
      Timeout: 900
      EphemeralStorage:
        Size: 10240                   # /tmp for DuckDB spill
      Environment:
        Variables:
          RESULTS_BUCKET: !Ref ResultsBucket
          URL_TTL_SECONDS: "3600"
          SENDER_EMAIL: tpoongundranar@urban.org          # verified SES sender (urban.org domain)
          DOWNLOAD_BASE_URL: !GetAtt DownloadFunctionUrl.FunctionUrl  # public link for the email receipt
          DOCS_URL: https://nccs.urban.org                # methodology/column docs link in the receipt (confirm)
      FunctionUrlConfig:
        AuthType: AWS_IAM             # callers (dashboard server) sign SigV4; testable via direct invoke
        Cors:
          AllowOrigins: ["*"]
          AllowMethods: [POST]
          AllowHeaders: [content-type]
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Sid: ReadNccsData        # read-only on the contracted data lake
              Effect: Allow
              Action: [s3:GetObject]
              Resource: arn:aws:s3:::nccsdata/*
            - Sid: ListNccsData
              Effect: Allow
              Action: [s3:ListBucket]
              Resource: arn:aws:s3:::nccsdata
            - Sid: WriteResults
              Effect: Allow
              Action: [s3:PutObject, s3:GetObject]
              Resource: !Sub arn:aws:s3:::sector-in-brief-api-results-${Stage}/*
            - Sid: SendReceipt         # ADR 0026 §3 default-on email receipt
              Effect: Allow
              Action: [ses:SendEmail]
              Resource: "*"

  # Public download endpoint (ADR 0026 §2/§3): the emailed link must be clickable
  # without AWS signing, so this is a SEPARATE Function URL with AuthType NONE,
  # gated (DOWNLOAD_ONLY) to refuse /data. Same code as QueryFunction.
  DownloadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub sector-in-brief-api-download-${Stage}
      CodeUri: ./query/
      Handler: query.lambda_handler
      Architectures: [x86_64]
      MemorySize: 10240               # re-materialize-on-expiry can be heavy
      Timeout: 900
      EphemeralStorage:
        Size: 10240
      Environment:
        Variables:
          RESULTS_BUCKET: !Ref ResultsBucket
          URL_TTL_SECONDS: "3600"
          DOWNLOAD_ONLY: "true"
      FunctionUrlConfig:
        AuthType: NONE                # public — clicked from email
        Cors:
          AllowOrigins: ["*"]
          AllowMethods: [GET]
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Sid: ReadNccsData
              Effect: Allow
              Action: [s3:GetObject]
              Resource: arn:aws:s3:::nccsdata/*
            - Sid: ListNccsData
              Effect: Allow
              Action: [s3:ListBucket]
              Resource: arn:aws:s3:::nccsdata
            - Sid: ReadWriteResults    # reads registry; re-materializes on expiry
              Effect: Allow
              Action: [s3:PutObject, s3:GetObject]
              Resource: !Sub arn:aws:s3:::sector-in-brief-api-results-${Stage}/*

  # Monthly usage rollup (ADR 0008 / usage-api.yml): aggregates the prior month's
  # logs/queries/ NDJSON into s3://nccsdata/usage/api/{YYYY_MM}/queries.parquet + manifest.
  RollupFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub sector-in-brief-api-rollup-${Stage}
      CodeUri: ./jobs/
      Handler: rollup.lambda_handler
      Architectures: [x86_64]
      MemorySize: 2048
      Timeout: 600
      EphemeralStorage:
        Size: 2048
      Environment:
        Variables:
          RESULTS_BUCKET: !Ref ResultsBucket
          # Only prod publishes the contracted artifact to the nccsdata lake;
          # staging writes to its own results bucket so it can't clobber prod.
          USAGE_BUCKET: !If [IsProd, nccsdata, !Ref ResultsBucket]
          USAGE_PREFIX: !If [IsProd, usage/api, usage/api-stg]
      Events:
        Monthly:
          Type: Schedule
          Properties:
            Schedule: cron(0 8 1 * ? *)    # 08:00 UTC on the 1st of each month
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Sid: ReadLogs
              Effect: Allow
              Action: [s3:GetObject, s3:ListBucket]
              Resource:
                - !Sub arn:aws:s3:::sector-in-brief-api-results-${Stage}
                - !Sub arn:aws:s3:::sector-in-brief-api-results-${Stage}/*
            - Sid: WriteUsageArtifact     # prod -> nccsdata/usage (contracted); stg -> results bucket
              Effect: Allow
              Action: [s3:PutObject]
              Resource:
                - arn:aws:s3:::nccsdata/usage/*
                - !Sub arn:aws:s3:::sector-in-brief-api-results-${Stage}/usage/*

Outputs:
  QueryFunctionUrl:
    Description: POST /data endpoint (Function URL, AWS_IAM)
    Value: !GetAtt QueryFunctionUrl.FunctionUrl
  DownloadFunctionUrl:
    Description: Public GET /download/{job_id} endpoint (the emailed link base)
    Value: !GetAtt DownloadFunctionUrl.FunctionUrl
  QueryFunction:
    Description: Query function name (for direct-invoke testing)
    Value: !Ref QueryFunction
  ResultsBucket:
    Value: !Ref ResultsBucket
