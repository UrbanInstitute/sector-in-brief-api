AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  sector-in-brief-api — modernized NCCS data-download API (ADR 0008 / 0026).
  DuckDB-on-parquet /data export behind a Lambda Function URL (no API Gateway 29s
  cap), writing to a dedicated results bucket with a 30-day lifecycle. Replaces
  the legacy Athena API. Slice 1: synchronous /data; durable /download, email
  receipt, and telemetry land in later slices.

Parameters:
  Stage:
    Type: String
    Default: stg
    AllowedValues: [stg, prod]

Globals:
  Function:
    Runtime: python3.12
    LoggingConfig:
      LogFormat: JSON

Resources:
  ResultsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub sector-in-brief-api-results-${Stage}
      LifecycleConfiguration:
        Rules:
          - Id: expire-results-30d        # ADR 0008: 30-day lifecycle from day one
            Status: Enabled
            ExpirationInDays: 30

  QueryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub sector-in-brief-api-query-${Stage}
      CodeUri: ./query/
      Handler: query.lambda_handler
      Architectures: [x86_64]
      MemorySize: 10240               # Lambda max — fits the heaviest realistic join (Phase-0: ~6 GB peak)
      Timeout: 900
      EphemeralStorage:
        Size: 10240                   # /tmp for DuckDB spill
      Environment:
        Variables:
          RESULTS_BUCKET: !Ref ResultsBucket
          URL_TTL_SECONDS: "3600"
      FunctionUrlConfig:
        AuthType: AWS_IAM             # callers (dashboard server) sign SigV4; testable via direct invoke
        Cors:
          AllowOrigins: ["*"]
          AllowMethods: [POST]
          AllowHeaders: [content-type]
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Sid: ReadNccsData        # read-only on the contracted data lake
              Effect: Allow
              Action: [s3:GetObject]
              Resource: arn:aws:s3:::nccsdata/*
            - Sid: ListNccsData
              Effect: Allow
              Action: [s3:ListBucket]
              Resource: arn:aws:s3:::nccsdata
            - Sid: WriteResults
              Effect: Allow
              Action: [s3:PutObject, s3:GetObject]
              Resource: !Sub arn:aws:s3:::sector-in-brief-api-results-${Stage}/*

Outputs:
  QueryFunctionUrl:
    Description: POST /data endpoint (Function URL)
    Value: !GetAtt QueryFunctionUrl.FunctionUrl
  QueryFunction:
    Description: Function name (for direct-invoke testing)
    Value: !Ref QueryFunction
  ResultsBucket:
    Value: !Ref ResultsBucket
