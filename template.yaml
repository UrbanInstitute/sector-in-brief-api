AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  sector-in-brief-api — modernized NCCS data-download API (ADR 0008 / 0026).
  DuckDB-on-parquet /data export behind a Lambda Function URL (no API Gateway 29s
  cap), writing to a dedicated results bucket with a 30-day lifecycle. Replaces
  the legacy Athena API. Slice 1: synchronous /data; durable /download, email
  receipt, and telemetry land in later slices.

Parameters:
  Stage:
    Type: String
    Default: stg
    AllowedValues: [stg, prod]
  # ADR 0030 async giant-export worker. Fargate needs a VPC + subnets; pass the
  # default VPC's public subnets (see docs/deploy.md). Leave WorkerVpcId empty to
  # deploy WITHOUT the async worker — the API then runs everything synchronously
  # (the handler guards on ECS_CLUSTER), so the stack degrades safely.
  WorkerVpcId:
    Type: String
    Default: ""
    Description: VPC for the Fargate worker (empty = async disabled).
  WorkerSubnets:
    Type: CommaDelimitedList
    Default: ""
    Description: Public subnet IDs for the Fargate worker (default-VPC subnets).
  WorkerCpu:
    Type: String
    Default: "8192"          # 8 vCPU
  WorkerMemory:
    Type: String
    Default: "61440"         # 60 GB; DuckDB spills past this to the 200 GB ephemeral volume
  AsyncThresholdBytes:
    Type: String
    Default: "8589934592"    # 8 GB — est. result over this routes to the Fargate worker (under Lambda's 10 GB cap). Lower for testing.

Conditions:
  IsProd: !Equals [!Ref Stage, prod]
  AsyncEnabled: !Not [!Equals [!Ref WorkerVpcId, ""]]

Globals:
  Function:
    Runtime: python3.12
    LoggingConfig:
      LogFormat: JSON

Resources:
  ResultsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub sector-in-brief-api-results-${Stage}
      LifecycleConfiguration:
        Rules:
          # ADR 0008: 30-day lifecycle. Scoped to results/ so the requests/
          # registry (ADR 0026 §2) persists on a longer clock — the two-clocks rule.
          - Id: expire-results-30d
            Status: Enabled
            Prefix: results/
            ExpirationInDays: 30

  QueryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub sector-in-brief-api-query-${Stage}
      CodeUri: ./query/
      Handler: query.lambda_handler
      Architectures: [x86_64]
      MemorySize: 10240               # Lambda max — fits the heaviest realistic join (Phase-0: ~6 GB peak)
      Timeout: 900
      EphemeralStorage:
        Size: 10240                   # /tmp for DuckDB spill
      Environment:
        Variables:
          RESULTS_BUCKET: !Ref ResultsBucket
          URL_TTL_SECONDS: "3600"
          SENDER_EMAIL: tpoongundranar@urban.org          # verified SES sender (urban.org domain)
          DOWNLOAD_BASE_URL: !GetAtt DownloadFunctionUrl.FunctionUrl  # public link for the email receipt
          DOCS_URL: https://nccs.urban.org                # methodology/column docs link in the receipt (confirm)
          # ADR 0030: route giants to Fargate. Empty ECS_CLUSTER => async disabled.
          ASYNC_THRESHOLD_BYTES: !Ref AsyncThresholdBytes
          ECS_CLUSTER: !If [AsyncEnabled, !Ref WorkerCluster, ""]
          ECS_TASK_DEF: !If [AsyncEnabled, !Sub "sector-in-brief-api-worker-${Stage}", ""]
          ECS_CONTAINER: worker
          ECS_SUBNETS: !If [AsyncEnabled, !Join [",", !Ref WorkerSubnets], ""]
          ECS_SECURITY_GROUP: !If [AsyncEnabled, !Ref WorkerSecurityGroup, ""]
      FunctionUrlConfig:
        AuthType: AWS_IAM             # callers (dashboard server) sign SigV4; testable via direct invoke
        Cors:
          AllowOrigins: ["*"]
          AllowMethods: [POST]
          AllowHeaders: [content-type]
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Sid: ReadNccsData        # read-only on the contracted data lake
              Effect: Allow
              Action: [s3:GetObject]
              Resource: arn:aws:s3:::nccsdata/*
            - Sid: ListNccsData
              Effect: Allow
              Action: [s3:ListBucket]
              Resource: arn:aws:s3:::nccsdata
            - Sid: WriteResults
              Effect: Allow
              Action: [s3:PutObject, s3:GetObject]
              Resource: !Sub arn:aws:s3:::sector-in-brief-api-results-${Stage}/*
            - Sid: SendReceipt         # ADR 0026 §3 default-on email receipt
              Effect: Allow
              Action: [ses:SendEmail]
              Resource: "*"

  # Public download endpoint (ADR 0026 §2/§3): the emailed link must be clickable
  # without AWS signing, so this is a SEPARATE Function URL with AuthType NONE,
  # gated (DOWNLOAD_ONLY) to refuse /data. Same code as QueryFunction.
  DownloadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub sector-in-brief-api-download-${Stage}
      CodeUri: ./query/
      Handler: query.lambda_handler
      Architectures: [x86_64]
      MemorySize: 10240               # re-materialize-on-expiry can be heavy
      Timeout: 900
      EphemeralStorage:
        Size: 10240
      Environment:
        Variables:
          RESULTS_BUCKET: !Ref ResultsBucket
          URL_TTL_SECONDS: "3600"
          DOWNLOAD_ONLY: "true"
      FunctionUrlConfig:
        AuthType: NONE                # public — clicked from email
        Cors:
          AllowOrigins: ["*"]
          AllowMethods: [GET]
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Sid: ReadNccsData
              Effect: Allow
              Action: [s3:GetObject]
              Resource: arn:aws:s3:::nccsdata/*
            - Sid: ListNccsData
              Effect: Allow
              Action: [s3:ListBucket]
              Resource: arn:aws:s3:::nccsdata
            - Sid: ReadWriteResults    # reads registry; re-materializes on expiry
              Effect: Allow
              Action: [s3:PutObject, s3:GetObject]
              Resource: !Sub arn:aws:s3:::sector-in-brief-api-results-${Stage}/*

  # Monthly usage rollup (ADR 0008 / usage-api.yml): aggregates the prior month's
  # logs/queries/ NDJSON into s3://nccsdata/usage/api/{YYYY_MM}/queries.parquet + manifest.
  RollupFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub sector-in-brief-api-rollup-${Stage}
      CodeUri: ./jobs/
      Handler: rollup.lambda_handler
      Architectures: [x86_64]
      MemorySize: 2048
      Timeout: 600
      EphemeralStorage:
        Size: 2048
      Environment:
        Variables:
          RESULTS_BUCKET: !Ref ResultsBucket
          # Only prod publishes the contracted artifact to the nccsdata lake;
          # staging writes to its own results bucket so it can't clobber prod.
          USAGE_BUCKET: !If [IsProd, nccsdata, !Ref ResultsBucket]
          USAGE_PREFIX: !If [IsProd, usage/api, usage/api-stg]
      Events:
        Monthly:
          Type: Schedule
          Properties:
            Schedule: cron(0 8 1 * ? *)    # 08:00 UTC on the 1st of each month
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Sid: ReadLogs
              Effect: Allow
              Action: [s3:GetObject, s3:ListBucket]
              Resource:
                - !Sub arn:aws:s3:::sector-in-brief-api-results-${Stage}
                - !Sub arn:aws:s3:::sector-in-brief-api-results-${Stage}/*
            - Sid: WriteUsageArtifact     # prod -> nccsdata/usage (contracted); stg -> results bucket
              Effect: Allow
              Action: [s3:PutObject]
              Resource:
                - arn:aws:s3:::nccsdata/usage/*
                - !Sub arn:aws:s3:::sector-in-brief-api-results-${Stage}/usage/*

  # ---- ADR 0030: async giant-export worker (Fargate) ----------------------
  # All gated on AsyncEnabled (WorkerVpcId provided), so a no-param deploy omits
  # them and the API runs everything synchronously.

  WorkerRepo:                          # ECR repo for the worker image (operator builds/pushes — see deploy.md)
    Type: AWS::ECR::Repository
    Condition: AsyncEnabled
    Properties:
      RepositoryName: !Sub sector-in-brief-api-worker-${Stage}
      ImageScanningConfiguration: { ScanOnPush: true }
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"keep last 5 images",
          "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":5},
          "action":{"type":"expire"}}]}

  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: AsyncEnabled
    Properties:
      LogGroupName: !Sub /ecs/sector-in-brief-api-worker-${Stage}
      RetentionInDays: 30

  WorkerSecurityGroup:                 # egress-only; the task reaches S3/ECR/SES over the internet
    Type: AWS::EC2::SecurityGroup
    Condition: AsyncEnabled
    Properties:
      GroupDescription: !Sub sector-in-brief-api worker egress (${Stage})
      VpcId: !Ref WorkerVpcId
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  WorkerCluster:
    Type: AWS::ECS::Cluster
    Condition: AsyncEnabled
    Properties:
      ClusterName: !Sub sector-in-brief-api-worker-${Stage}

  WorkerExecutionRole:                 # ECS agent: pull image from ECR + write task logs
    Type: AWS::IAM::Role
    Condition: AsyncEnabled
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  WorkerTaskRole:                      # the worker app's own perms (same shape as QueryFunction)
    Type: AWS::IAM::Role
    Condition: AsyncEnabled
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: worker-data-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadNccsData
                Effect: Allow
                Action: [s3:GetObject]
                Resource: arn:aws:s3:::nccsdata/*
              - Sid: ListNccsData
                Effect: Allow
                Action: [s3:ListBucket]
                Resource: arn:aws:s3:::nccsdata
              - Sid: ReadWriteResults
                Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub arn:aws:s3:::sector-in-brief-api-results-${Stage}/*
              - Sid: SendReceipt
                Effect: Allow
                Action: [ses:SendEmail]
                Resource: "*"

  WorkerTaskDef:
    Type: AWS::ECS::TaskDefinition
    Condition: AsyncEnabled
    Properties:
      Family: !Sub sector-in-brief-api-worker-${Stage}
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref WorkerCpu
      Memory: !Ref WorkerMemory
      EphemeralStorage:
        SizeInGiB: 200                 # DuckDB spill room past the memory limit (max for Fargate)
      ExecutionRoleArn: !GetAtt WorkerExecutionRole.Arn
      TaskRoleArn: !GetAtt WorkerTaskRole.Arn
      ContainerDefinitions:
        - Name: worker                 # must match ECS_CONTAINER on the Lambda
          Image: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/sector-in-brief-api-worker-${Stage}:latest
          Essential: true
          Environment:
            - { Name: RESULTS_BUCKET, Value: !Ref ResultsBucket }
            - { Name: URL_TTL_SECONDS, Value: "3600" }
            - { Name: SENDER_EMAIL, Value: tpoongundranar@urban.org }
            - { Name: DOWNLOAD_BASE_URL, Value: !GetAtt DownloadFunctionUrl.FunctionUrl }
            - { Name: DOCS_URL, Value: https://nccs.urban.org }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref WorkerLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: worker

  QueryAsyncPolicy:                    # let the query Lambda launch the worker task
    Type: AWS::IAM::Policy
    Condition: AsyncEnabled
    Properties:
      PolicyName: dispatch-fargate
      Roles: [!Ref QueryFunctionRole]  # SAM-generated role for QueryFunction
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: RunWorkerTask
            Effect: Allow
            Action: ecs:RunTask
            Resource: !Sub arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/sector-in-brief-api-worker-${Stage}:*
          - Sid: PassWorkerRoles
            Effect: Allow
            Action: iam:PassRole
            Resource:
              - !GetAtt WorkerExecutionRole.Arn
              - !GetAtt WorkerTaskRole.Arn

Outputs:
  QueryFunctionUrl:
    Description: POST /data endpoint (Function URL, AWS_IAM)
    Value: !GetAtt QueryFunctionUrl.FunctionUrl
  DownloadFunctionUrl:
    Description: Public GET /download/{job_id} endpoint (the emailed link base)
    Value: !GetAtt DownloadFunctionUrl.FunctionUrl
  QueryFunction:
    Description: Query function name (for direct-invoke testing)
    Value: !Ref QueryFunction
  ResultsBucket:
    Value: !Ref ResultsBucket
  WorkerRepoUri:
    Condition: AsyncEnabled
    Description: ECR repo for the worker image — docker build/push here before async deploy
    Value: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/sector-in-brief-api-worker-${Stage}
