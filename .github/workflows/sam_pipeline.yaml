# CI/CD for sector-in-brief-api.
#   PRs / pushes      -> unit tests
#   push to staging   -> test -> deploy stg  -> smoke (gate)
#   push to production -> test -> [manual approval] -> deploy prod -> smoke (gate)
#
# Prereqs (provisioned out-of-band, see docs/deploy.md):
#   - secrets.AWS_DEPLOY_ROLE_ARN : GitHub OIDC role this workflow assumes (deploy + invoke + s3).
#   - GitHub Environment "production" with required reviewers  -> the manual prod gate.
name: ci-cd

on:
  push:
    branches: [staging, production]
  pull_request:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install duckdb boto3 pytest
      - name: Unit tests
        run: RESULTS_BUCKET=ci python -m pytest tests/test_query.py tests/test_rollup.py -q

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Maps the branch to a GitHub Environment; protect "production" with required
    # reviewers to get the manual gate before prod.
    environment: ${{ github.ref_name == 'production' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve stage from branch
        run: |
          if [ "${{ github.ref_name }}" = "production" ]; then
            echo "STAGE=prod" >> "$GITHUB_ENV"
          else
            echo "STAGE=stg" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: aws-actions/setup-sam@v2
        with: { use-installer: true }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Build
        run: sam build
      - name: Deploy
        run: |
          sam deploy --stack-name sector-in-brief-api-${STAGE} \
            --capabilities CAPABILITY_IAM --resolve-s3 --no-confirm-changeset \
            --no-fail-on-empty-changeset --parameter-overrides Stage=${STAGE}
      - name: Smoke test (gate)
        run: |
          pip install boto3
          RESULTS_BUCKET=sector-in-brief-api-results-${STAGE} \
            QUERY_FN=sector-in-brief-api-query-${STAGE} \
            python tests/smoke.py
