openapi: 3.1.0
info:
  title: sector-in-brief-api
  version: 0.1.0
  description: >
    Modernized NCCS data-download API (ADR 0008 / 0026). DuckDB-on-parquet:
    joins the contracted CORE tiers + bmf-master-geocoded on EIN at query time
    (ADR 0016, no pre-merged table), materializes the result to S3, and returns
    presigned URLs (pattern B — bytes never flow through the API process).

    Interface contract per ADR 0026 §5 (OpenAPI lives in this repo, not
    nccs-contracts). This is the slice-1 surface: synchronous /data via a Lambda
    Function URL (no API Gateway 29s cap). The durable /download/{job_id} +
    request registry + email receipt + telemetry land in later slices.

    Auth: POST /data is on a Function URL with AuthType AWS_IAM (the dashboard
    server signs SigV4). GET /download/{job_id} is a SEPARATE, public Function
    URL (AuthType NONE) so the emailed receipt link is clickable without signing.

    Column names are the NEW parquet names (e.g. ein, geo_state_abbr,
    total_revenue) — there is no backward-compat mapping to the legacy
    pre-merged table's column names; the dashboard form is reworked to match
    (ADR 0026 §6).

    Two query modes via `source`: `core` (default) joins CORE tax-year
    partitions to bmf-master-geocoded on EIN and is filtered by `tax_years`;
    `bmf` drops the join and selects one row per EIN straight from
    bmf-master-geocoded (the org registry, incl. non-filers; no financials /
    tax-year) and is filtered by `active_years` (org-lifespan overlap). See
    ADR 0029.

servers:
  - url: https://{functionUrlId}.lambda-url.us-east-1.on.aws
    variables:
      functionUrlId: { default: REPLACE_WITH_DEPLOYED_FUNCTION_URL_ID }

paths:
  /data:
    post:
      operationId: createExport
      summary: Run a filtered EIN-join export and return presigned download URLs.
      description: >
        Validates the requested columns/filters against the live parquet schema
        (column names are whitelisted — the SQL-injection guard, since
        identifiers can't be parameterized; filter values are bound parameters),
        runs the DuckDB join across the requested core tax-year partitions joined
        to bmf-master-geocoded on EIN, writes the result to the results bucket,
        and assembles a merged data dictionary (from the per-dataset
        dictionaries, filtered to the delivered columns). Synchronous: returns
        when materialization completes (Function URL allows up to 900s).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExportRequest' }
      responses:
        '200':
          description: Export materialized; presigned URLs returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportResponse' }
        '400':
          description: Validation error (unknown column, empty selection, bad filter).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /download/{job_id}:
    get:
      operationId: getDownload
      summary: Durable download link — re-issues a presigned URL, re-materializing if expired.
      description: >
        ADR 0026 §2. Resolves the request registry (requests/{job_id}.json); if
        the result object still exists, 302-redirects to a freshly-issued
        presigned URL; if the 30-day lifecycle has swept it, re-runs the query
        from the stored params and redirects to the fresh result. This is the
        link emailed to the requester (slice 3) — durable for as long as the
        underlying data vintage exists, while storage stays bounded by the
        lifecycle rule.
      parameters:
        - name: job_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '302': { description: Redirect to a freshly-issued presigned URL. }
        '404': { description: Unknown job_id. }

components:
  schemas:
    ExportRequest:
      type: object
      required: [columns]
      additionalProperties: false
      allOf:
        # source=bmf (default core) rejects tax_years/forms and requires active_years;
        # source=core requires tax_years and ignores active_years.
        - if:
            properties: { source: { const: bmf } }
            required: [source]
          then:
            required: [active_years]
            not: { anyOf: [ { required: [tax_years] }, { required: [forms] } ] }
          else:
            required: [tax_years]
      properties:
        source:
          type: string
          enum: [core, bmf]
          default: core
          description: >
            Query mode (ADR 0029). `core` (default): join the CORE tax-year
            partitions to bmf-master-geocoded on EIN; filtered by `tax_years`.
            `bmf`: org-level registry only (one row per EIN from
            bmf-master-geocoded, incl. non-filers; no financials / tax-year);
            filtered by `active_years`. `tax_years`/`forms` apply only to
            `core`; `active_years` applies only to `bmf`.
        tax_years:
          type: array
          minItems: 1
          items: { type: integer, minimum: 1989 }
          description: >
            CORE 990 tax-year partitions to read (selects which parquet files).
            Required when `source=core`; rejected when `source=bmf` (use
            `active_years` for the BMF lifespan filter).
          example: [2019, 2020]
        active_years:
          type: array
          minItems: 1
          items: { type: integer, minimum: 1989 }
          description: >
            BMF lifespan filter (`source=bmf` only). Selects orgs whose
            registry lifespan OVERLAPS the requested span — predicate
            `first_year_in_bmf <= max(active_years) AND last_year_in_bmf >=
            min(active_years)`, i.e. "active at any point in the span." This is
            the active-window rule of the sector-in-brief count, NOT an `IN` on
            a single lifespan column (which means "first/last year == Y" — a
            ~19x-smaller, wrong set). Only the span endpoints matter; gaps
            between them are not listed. When applied, BOTH `first_year_in_bmf`
            and `last_year_in_bmf` are forced into the output columns (filter
            provenance — the result self-audits the predicate).
          example: [2018, 2020]
        forms:
          type: array
          minItems: 1
          default: [990, 990ez, 990pf, 990combined]
          items:
            type: string
            enum: [990, 990ez, 990pf, 990combined]
          description: >
            Core form types to include, read from
            processed/core/{tax_year}/{form}/. Filings across the selected forms
            are unioned (union_by_name — 990-PF columns don't align with 990/EZ,
            so columns absent from a form are null for those rows). NB: 990combined
            already unions 990 + 990-EZ, so selecting it alongside 990/990ez can
            double-count rows — the form set is the caller's choice; the API does
            not dedup across forms.
          example: [990, 990ez, 990pf, 990combined]
        columns:
          type: array
          minItems: 1
          items: { type: string }
          description: >
            Output columns by new parquet name. Sources: core, bmf-master-geocoded,
            and API-derived columns it composes (mirroring sector-in-brief-data):
            crosswalk geography (ADR 0021/0023) — `geo_county_fips` (canonical
            5-char county GEOID — filter by THIS, not name), `geo_county_canonical`,
            `cbsa_code`, `cbsa_title`, `cbsa_type`, `csa_code`, `csa_title`,
            `census_region`; and `org_type` (IRS 501(c) subsection classification,
            with 501(c)(3) split into Public Charities vs Private Foundations —
            this is the dashboard's Organization Type filter, NOT `nteev2_org_type`,
            a separate NTEE-V2 dimension); and `nteev2_subsector_definition`
            (plain-English subsector label; mirrors table_builder_subsector.R and
            OVERRIDES bmf's raw same-named column — EDU/HEL become
            "(minus Universities/Hospitals)" and UNU/NULL fold into "Other", so it
            is null-free). Validated against the live schema allowlist;
            `ein` always included.
          example: [ein, org_name_display, org_type, geo_state_abbr, geo_county_fips, census_region, nteev2_subsector, nteev2_subsector_definition, total_revenue]
        filters:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
          description: column -> allowed values; combined as WHERE col IN (...) AND ... (values are bound parameters).
          example: { geo_state_abbr: [CA, NY], org_type: ["501(c)(3) Private Foundations"] }
        format:
          type: string
          enum: [csv, parquet]
          default: csv
        email:
          type: string
          format: email
          description: Requester email; a default-on receipt with the durable links is sent (ADR 0026 §3).
        estimate:
          type: boolean
          default: false
          description: >
            Size pre-check only (ADR 0026 §6). Returns {row_count, columns,
            estimated_bytes} from an exact count + a 5k-row sample — no
            materialization, no S3 write, no email. The dashboard calls this to
            warn before a large export.
    ExportResponse:
      type: object
      required: [job_id, row_count, result, data_dictionary, download_path]
      properties:
        job_id: { type: string, format: uuid }
        row_count: { type: integer }
        download_path:
          type: string
          description: Durable endpoint for this export, e.g. /download/{job_id}.
          example: /download/f169b367-eee8-4c74-bb44-bb4ca4e8d558
        download_url:
          type: [string, "null"]
          description: Absolute durable link (public download Function URL + download_path) — the link emailed to the requester.
        email:
          type: [object, "null"]
          description: Present when the request carried an email; the default-on receipt (ADR 0026 §3).
          properties:
            to: { type: string, format: email }
            status: { type: string, enum: [sent], description: "or failure marker e.g. failed:<Error>" }
        result:
          type: object
          properties:
            format: { type: string, enum: [csv, parquet] }
            bytes: { type: integer }
            url: { type: string, format: uri, description: Presigned URL (TTL ≤ object lifetime). }
            expires_in_seconds: { type: integer }
        data_dictionary:
          type: object
          description: Merged from the per-dataset dictionaries, filtered to delivered columns.
          properties:
            url: { type: string, format: uri }
            columns: { type: integer }
            schema:
              type: array
              items: { type: string }
              default: [column, source, description, data_type, null_pct]
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        detail: { type: string }
